<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>David Dionísio Coelho</title>
<link rel="icon" type="image/svg+xml" href="uploads/favicon/favicon.svg"/>
<link rel="icon" type="image/png" sizes="32x32" href="uploads/favicon/favicon-32x32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="uploads/favicon/favicon-16x16.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="uploads/favicon/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f8f6;
    --panel: #ffffff;
    --border: #e4e4e0;
    --text: #111110;
    --muted: #888884;
    --accent: #2351d4;
    --accent-light: #eef1fc;
    --sidebar-w: 300px;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'Space Grotesk', sans-serif;
    --font-mono: 'Space Mono', monospace;
  }

  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }

  /* SIDEBAR */
  .sidebar {
    position: fixed;
    top: 0; left: 0;
    width: var(--sidebar-w);
    height: 100vh;
    background: var(--text);
    color: #f8f8f6;
    display: flex;
    flex-direction: column;
    padding: 40px 32px;
    z-index: 100;
    overflow-y: auto;
    transition: transform 0.25s ease;
  }

  .sidebar-close { display: none; }
  .mobile-topbar { display: none; }
  .sidebar-overlay { display: none; }

  .sidebar-name {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }

  .sidebar-title {
    font-size: 11px;
    font-weight: 400;
    color: #9a9a96;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 36px;
    line-height: 1.6;
  }

  .nav-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #555552;
    font-weight: 600;
    margin-bottom: 12px;
  }

  .nav-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    color: #9a9a96;
    font-size: 13px;
    font-weight: 400;
    cursor: pointer;
    border-bottom: 1px solid #1e1e1c;
    transition: color 0.15s;
    text-decoration: none;
  }
  .nav-link:hover, .nav-link.active { color: #f8f8f6; }
  .nav-link .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #333330;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .nav-link:hover .dot, .nav-link.active .dot { background: var(--accent); }

  .sidebar-contacts {
    margin-top: auto;
    padding-top: 24px;
    border-top: 1px solid #1e1e1c;
  }

  .contact-item {
    font-size: 11px;
    color: #666663;
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .contact-item a { color: #888884; text-decoration: none; }
  .contact-item a:hover { color: #f8f8f6; }
  .contact-label { color: #444441; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 2px; }

  .lang-toggle {
    display: flex;
    gap: 0;
    margin-top: 24px;
    background: #1a1a18;
    border-radius: 4px;
    overflow: hidden;
  }
  .lang-btn {
    flex: 1;
    padding: 7px;
    font-size: 11px;
    font-family: var(--font-mono);
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    border: none;
    background: transparent;
    color: #555552;
    transition: all 0.2s;
  }
  .lang-btn.active {
    background: var(--accent);
    color: #fff;
  }

  /* MAIN CONTENT */
  .main {
    margin-left: var(--sidebar-w);
    padding: 40px 48px;
    min-height: 100vh;
  }

  /* HERO STRIP */
  .hero {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 40px 48px;
    margin-bottom: 24px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 24px;
    align-items: center;
  }
  .hero-eyebrow {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 12px;
    font-family: var(--font-mono);
  }
  .hero-headline {
    font-family: var(--font-display);
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 16px;
  }
  .hero-bio {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.75;
    max-width: 560px;
    font-weight: 300;
  }
  .hero-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  .hero-photo {
    width: 120px;
    height: 140px;
    border-radius: 6px;
    object-fit: cover;
    object-position: center top;
    display: block;
    filter: grayscale(8%);
  }
  .btn-primary {
    padding: 12px 24px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 5px;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary {
    padding: 11px 24px;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s;
  }
  .btn-secondary:hover { border-color: var(--text); }

  /* GRID */
  .dashboard-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  .dashboard-grid > * { min-width: 0; }
  .full-width { grid-column: 1 / -1; }

  /* PANELS */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px 32px;
    min-width: 0;
    animation: fadeUp 0.5s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .panel-title {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--muted);
  }
  .panel-count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
  }

  /* SKILLS */
  .skill-category {
    margin-bottom: 20px;
  }
  .skill-cat-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .skill-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag {
    padding: 5px 12px;
    border-radius: 3px;
    font-size: 12px;
    font-family: var(--font-mono);
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    font-weight: 400;
  }
  .tag.accent {
    background: var(--accent-light);
    color: var(--accent);
    border-color: #c5cdf0;
  }
  .tag.dev {
    background: #fef9ec;
    color: #92620a;
    border-color: #f0dfa0;
  }

  /* EXPERIENCE */
  .exp-item {
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
  }
  .exp-item:last-child { border-bottom: none; padding-bottom: 0; }
  .exp-item:first-child { padding-top: 0; }
  .exp-meta {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
    gap: 16px;
  }
  .exp-role {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }
  .exp-period {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
    margin-top: 2px;
    flex-shrink: 0;
  }
  .exp-company {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .exp-bullets {
    list-style: none;
    margin-top: 8px;
  }
  .exp-bullets li {
    font-size: 12.5px;
    color: #555552;
    line-height: 1.65;
    padding-left: 14px;
    position: relative;
    margin-bottom: 4px;
  }
  .exp-bullets li::before {
    content: '—';
    position: absolute;
    left: 0;
    color: var(--border);
  }

  /* EDUCATION */
  .edu-item {
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }
  .edu-item:last-child { border-bottom: none; padding-bottom: 0; }
  .edu-item:first-child { padding-top: 0; }
  .edu-degree {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 3px;
    font-style: italic;
  }
  .edu-school {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .edu-details {
    font-size: 12px;
    color: #777773;
    line-height: 1.6;
  }

  /* LANG TABLE */
  .lang-table { width: 100%; border-collapse: collapse; }
  .lang-table th {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    text-align: left;
    padding: 0 0 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .lang-table td {
    padding: 10px 0;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .lang-table tr:last-child td { border-bottom: none; }
  .lang-table td:first-child { font-weight: 600; }
  .lang-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 11px;
    font-family: var(--font-mono);
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .lang-badge.native {
    background: var(--accent-light);
    color: var(--accent);
    border-color: #c5cdf0;
  }

  /* CERT */
  .cert-item {
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
  }
  .cert-item:last-child { border-bottom: none; }
  .cert-item:first-child { padding-top: 0; }
  .cert-name { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
  .cert-detail { font-size: 11px; color: var(--muted); }
  .cert-year {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* PROJECTS */
  .proj-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .proj-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }
  .proj-context {
    font-size: 11px;
    font-style: italic;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .proj-context.personal {
    color: var(--accent);
    font-style: normal;
    font-weight: 600;
  }
  .proj-title {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
  }
  .proj-image {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 6px;
    display: block;
    transition: opacity 0.15s;
  }
  .proj-image-link { display: block; }
  .proj-image-link:hover .proj-image { opacity: 0.85; }
  .proj-image-placeholder {
    width: 100%;
    border: 1px dashed var(--border);
    border-radius: 6px;
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    background: var(--bg);
    text-align: center;
    padding: 0 12px;
  }
  .proj-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .proj-desc {
    font-size: 12.5px;
    color: #555552;
    line-height: 1.65;
  }
  .proj-cta {
    display: inline-block;
    align-self: flex-start;
    margin-top: 4px;
    padding: 10px 20px;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 500;
    text-decoration: none;
    transition: border-color 0.15s;
  }
  .proj-cta:hover { border-color: var(--text); }

  /* CONTACT MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--panel);
    border-radius: 10px;
    padding: 40px;
    width: 480px;
    max-width: 90vw;
    position: relative;
  }
  .modal-title {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
  .modal-close {
    position: absolute;
    top: 16px; right: 20px;
    background: none; border: none;
    font-size: 22px; cursor: pointer; color: var(--muted);
  }
  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .form-input, .form-textarea {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-family: var(--font-body);
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .form-input:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea { resize: vertical; min-height: 100px; }
  .form-success {
    text-align: center;
    padding: 20px 0;
  }
  .form-success-icon {
    font-size: 40px; margin-bottom: 12px;
  }
  .form-success-title { font-family: var(--font-display); font-size: 22px; margin-bottom: 8px; }
  .form-success-text { font-size: 13px; color: var(--muted); }

  /* TWEAKS PANEL */
  .tweaks-panel {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--text);
    color: #f8f8f6;
    border-radius: 10px;
    padding: 20px 24px;
    width: 240px;
    z-index: 300;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: slideUp 0.2s ease;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .tweaks-title {
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    font-weight: 700; margin-bottom: 16px; color: #777772;
  }
  .tweak-row { margin-bottom: 14px; }
  .tweak-label { font-size: 11px; color: #888884; margin-bottom: 6px; }
  .tweak-options { display: flex; gap: 6px; flex-wrap: wrap; }
  .tweak-opt {
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    border: 1px solid #2a2a28;
    background: transparent;
    color: #888884;
    font-family: var(--font-mono);
    transition: all 0.15s;
  }
  .tweak-opt.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  @media (max-width: 900px) {
    :root { --sidebar-w: 0px; }
    .sidebar {
      transform: translateX(-100%);
      width: min(300px, 82vw);
      z-index: 160;
      box-shadow: 20px 0 60px rgba(0,0,0,0.35);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-close {
      display: block;
      position: absolute;
      top: 16px; right: 20px;
      background: none;
      border: none;
      color: #9a9a96;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
    }
    .sidebar-overlay {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 150;
      animation: fadeIn 0.2s ease;
    }
    .main { margin-left: 0; padding: 20px; padding-top: 76px; }
    .mobile-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      padding: 0 16px;
      background: var(--text);
      z-index: 140;
    }
    .mobile-menu-btn {
      background: none;
      border: none;
      color: #f8f8f6;
      font-size: 20px;
      cursor: pointer;
      padding: 8px;
      line-height: 1;
    }
    .mobile-topbar-name {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;
      color: #f8f8f6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mobile-lang-toggle { flex-shrink: 0; margin: 0; width: 68px; }
    .dashboard-grid { grid-template-columns: 1fr; }
    .proj-grid { grid-template-columns: 1fr; }
    .hero { grid-template-columns: 1fr; }
    .hero-actions { align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
  }

  @media (max-width: 640px) {
    .hero { padding: 28px 20px; }
    .hero-headline { font-size: 30px; }
    .hero-actions { flex-direction: column; align-items: stretch; }
    .hero-photo { align-self: center; }
    .btn-primary, .btn-secondary { width: 100%; text-align: center; }
    .panel { padding: 20px; }
    .proj-image, .proj-image-placeholder { height: 150px; }
    .exp-meta { flex-direction: column; gap: 2px; }
    .cert-item { grid-template-columns: 1fr; align-items: flex-start; }
    .modal { padding: 24px; }
    .lang-table { display: block; overflow-x: auto; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect, useRef } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#1a6b47",
  "fontSize": "normal",
  "sidebarTheme": "dark"
} /*EDITMODE-END*/;

const content = {
  PT: {
    eyebrow: "Disponível para novas oportunidades",
    headline: "David Dionísio\nCoelho",
    bio: "Mestrando em Economia (Financial Track) na FEUC, com 8 anos de experiência em gestão operacional e controlo. Já trabalhei com budget, capex, controlo mensal de desvios e reporting analítico para a gestão em organizações de média dimensão.",
    downloadBtn: "Descarregar CV",
    contactBtn: "Contactar",
    nav: ["Perfil", "Competências", "Experiência", "Projetos", "Formação", "Certificações", "Línguas"],
    sections: {
      skills: "Competências",
      experience: "Experiência Profissional",
      projects: "Projetos",
      education: "Formação Académica",
      certs: "Certificações",
      langs: "Línguas"
    },
    skillCategories: [

function ProjectImage({ src, alt, lang }) {
  const [error, setError] = useState(false);
  if (!src || error) {
    return (
      <div className="proj-image-placeholder">
        {lang === 'PT' ? 'Imagem em breve' : 'Image coming soon'}
      </div>);

  }
  return <img className="proj-image" src={src} alt={alt} onError={() => setError(true)} />;
}

                  {p.image && !p.link && <ProjectImage src={p.image} alt={p.title} lang={lang} />}
                  <div className={`proj-context ${p.personal ? 'personal' : ''}`}>{p.context}</div>
                  <div className="proj-title">{p.title}</div>
                  <div className="proj-tags">
                    {p.stack.map((t, j) => <span key={j} className="tag accent">{t}</span>)}
                  </div>
                  <div className="proj-desc">{p.desc}</div>
                  {p.link && !p.image &&
                <a className="proj-cta" href={p.link} target="_blank" rel="noopener noreferrer">
                      {lang === 'PT' ? 'Ver projeto' : 'View project'}
                    </a>
                }
                </div>
              )}
            </div>
          </div>
        </section>
      </main>

      {/* CONTACT MODAL */}
      {showModal &&
      <div className="modal-overlay" onClick={(e) => e.target === e.currentTarget && setShowModal(false)}>
          <div className="modal">
            <button className="modal-close" onClick={() => setShowModal(false)}>×</button>
            {submitted ?
          <div className="form-success">
                <div className="form-success-icon">✓</div>
                <div className="form-success-title">{c.successMsg.title}</div>
                <div className="form-success-text">{c.successMsg.text}</div>
              </div> :

          <>
                <div className="modal-title">{c.contactTitle}</div>
                <div className="modal-sub">{c.contactSub}</div>
                <form onSubmit={handleSubmit}>
                  <div className="form-group">
                    <label className="form-label">{c.formLabels.name}</label>
                    <input className="form-input" required value={formState.name}
                onChange={(e) => setFormState({ ...formState, name: e.target.value })} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">{c.formLabels.email}</label>
                    <input className="form-input" type="email" required value={formState.email}
                onChange={(e) => setFormState({ ...formState, email: e.target.value })} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">{c.formLabels.message}</label>
                    <textarea className="form-textarea" required value={formState.message}
                onChange={(e) => setFormState({ ...formState, message: e.target.value })} />
                  </div>
                  <button type="submit" className="btn-primary" style={{ width: '100%', padding: '13px' }}>
                    {c.formLabels.send}
                  </button>
                </form>
              </>
          }
          </div>
        </div>
      }

      {/* TWEAKS */}
      {showTweaks &&
      <div className="tweaks-panel">
          <div className="tweaks-title">Tweaks</div>
          <div className="tweak-row">
            <div className="tweak-label">Cor de destaque</div>
            <div className="tweak-options">
              {[
            { label: 'Azul', val: '#2351d4' },
            { label: 'Índigo', val: '#5c3ec7' },
            { label: 'Verde', val: '#1a6b47' },
            { label: 'Cinza', val: '#444441' }].
            map((opt) =>
            <button key={opt.val} className={`tweak-opt ${tweaks.accentColor === opt.val ? 'active' : ''}`}
            onClick={() => updateTweak('accentColor', opt.val)}>{opt.label}</button>
            )}
            </div>
          </div>
          <div className="tweak-row">
            <div className="tweak-label">Tamanho do texto</div>
            <div className="tweak-options">
              {['small', 'normal', 'large'].map((s) =>
            <button key={s} className={`tweak-opt ${tweaks.fontSize === s ? 'active' : ''}`}
            onClick={() => updateTweak('fontSize', s)}>{s}</button>
            )}
            </div>
          </div>
        </div>
      }

      <style>{`
        @media print {
          .sidebar, .hero-actions, .tweaks-panel { display: none !important; }
          .main { margin-left: 0 !important; padding: 20px !important; }
          .panel { break-inside: avoid; box-shadow: none; border: 1px solid #ddd; }
          .dashboard-grid { grid-template-columns: 1fr 1fr; }
        }
      `}</style>
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
